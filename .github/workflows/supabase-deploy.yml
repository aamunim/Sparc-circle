name: Supabase DB & Edge Functions Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"

jobs:
  deploy-supabase:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SSLCOMMERZ_STORE_ID: ${{ secrets.SSLCOMMERZ_STORE_ID }}
      SSLCOMMERZ_STORE_PASS: ${{ secrets.SSLCOMMERZ_STORE_PASS }}
      BKASH_APP_KEY: ${{ secrets.BKASH_APP_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Supabase Secrets Presence
        id: check_secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase secrets not yet added — skipping remote DB push."
          else
            REF="$SUPABASE_PROJECT_REF"
            if [ -z "$REF" ] && [ -n "$SUPABASE_URL" ]; then
              STRIPPED="${SUPABASE_URL#https://}"
              STRIPPED="${STRIPPED#http://}"
              REF="${STRIPPED%%.*}"
            fi
            if [ -z "$REF" ]; then
              echo "::error::Could not determine Supabase project ref. Set SUPABASE_URL or SUPABASE_PROJECT_REF."
              exit 1
            fi
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "project_ref=$REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Supabase CLI (Pinned v3.4.0)
        if: steps.check_secrets.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 3.4.0

      - name: Link Project & Push SQL Migrations (Schema, Triggers, RLS & Seed Books)
        if: steps.check_secrets.outputs.configured == 'true'
        run: |
          supabase link --project-ref "${{ steps.check_secrets.outputs.project_ref }}"
          supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Sync Optional Edge Function Secrets
        if: steps.check_secrets.outputs.configured == 'true'
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            supabase secrets set --project-ref "${{ steps.check_secrets.outputs.project_ref }}" GEMINI_API_KEY="$GEMINI_API_KEY"
          fi
          if [ -n "$SSLCOMMERZ_STORE_ID" ]; then
            supabase secrets set --project-ref "${{ steps.check_secrets.outputs.project_ref }}" SSLCOMMERZ_STORE_ID="$SSLCOMMERZ_STORE_ID" SSLCOMMERZ_STORE_PASS="$SSLCOMMERZ_STORE_PASS"
          fi
          if [ -n "$BKASH_APP_KEY" ]; then
            supabase secrets set --project-ref "${{ steps.check_secrets.outputs.project_ref }}" BKASH_APP_KEY="$BKASH_APP_KEY"
          fi

      - name: Deploy All 4 Supabase Edge Functions
        if: steps.check_secrets.outputs.configured == 'true'
        run: |
          REF="${{ steps.check_secrets.outputs.project_ref }}"
          supabase functions deploy ai-writing-assistant --project-ref "$REF"
          supabase functions deploy wallet-payment --project-ref "$REF"
          supabase functions deploy poke-dispatch --project-ref "$REF"
          supabase functions deploy generate-certificate --project-ref "$REF"
