name: Android CI & APK Release

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run Domain Unit Tests & Build Debug APK (with Supabase GitHub Secrets)
        working-directory: android-app
        env:
          SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_SECRET: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon \
            -PSUPABASE_URL="$SUPABASE_URL_SECRET" \
            -PSUPABASE_ANON_KEY="$SUPABASE_ANON_SECRET"
          cp app/build/outputs/apk/debug/app-debug.apk ../SPARC-Study-Circle-v3.1.${{ github.run_number }}.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPARC-Study-Circle-v3.1.${{ github.run_number }}-apk
          path: SPARC-Study-Circle-v3.1.${{ github.run_number }}.apk

      - name: Publish Fresh Latest GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.1.${{ github.run_number }}"
          APK_FILE="SPARC-Study-Circle-v3.1.${{ github.run_number }}.apk"
          gh release create "$TAG" "$APK_FILE" \
            --latest \
            --title "SPARC Study Circle $TAG — Auth, Native PDF Reader, ExoPlayer Audio & Custom Icon" \
            --notes "নতুন প্রোডাকশন আপগ্রেড ($TAG):
          - 🆕 **কাস্টম SPARC অ্যাপ আইকন ও অ্যানিমেটেড স্প্ল্যাশ স্ক্রিন**
          - 🔐 **Live Supabase Auth & Sync প্রস্তুত** (`SUPABASE_URL` ও `SUPABASE_ANON_KEY` GitHub Secrets থেকে স্বয়ংক্রিয়ভাবে ইনজেক্ট হয়)
          - 📄 **নেটিভ Android PDF বুক রিডার (PdfRenderer)** — জুম, পেজ নেভিগেশন ও ফোন থেকে যেকোনো `.pdf` খোলার সুবিধা
          - 🎧 **Media3 ExoPlayer অডিও সামারি প্লেয়ার** — লাইভ সিকবার, `-10s/+10s` স্কিপ ও `1x/1.25x/1.5x/2x` স্পিড কন্ট্রোল
          - 🎨 সেটিংসে ৩টি মডার্ন UI থিম ও বাংলা/ইংরেজি ভাষা সুইচার।"
