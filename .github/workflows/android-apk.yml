name: Android CI & APK Release

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run Domain Unit Tests & Build Debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SPARC-Study-Circle-v3.0.${{ github.run_number }}-multi-theme.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPARC-Study-Circle-v3.0.${{ github.run_number }}-apk
          path: SPARC-Study-Circle-v3.0.${{ github.run_number }}-multi-theme.apk

      - name: Publish Fresh Latest GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.0.${{ github.run_number }}"
          APK_FILE="SPARC-Study-Circle-v3.0.${{ github.run_number }}-multi-theme.apk"
          gh release create "$TAG" "$APK_FILE" \
            --latest \
            --title "SPARC Study Circle $TAG — 3-Theme Modern UI (Cobalt, Midnight & Ocean)" \
            --notes "নতুন ৩-থিম মডার্ন UI আপডেট ($TAG):
          - ⚙️ অ্যাপের উপরের Settings গিয়ার আইকন থেকে **Cobalt SaaS (Light)**, **Midnight Glass (Dark)** এবং **Ocean Hero (Layered)** — ৩টি থিমেই তাৎক্ষণিক পরিবর্তন ও অটো-সেভ সুবিধা।
          - ফ্লোটিং ক্যাপসুল বটম নেভিগেশন ডক ও ১২টি পূর্ণাঙ্গ মডার্ন স্ক্রিন।"
