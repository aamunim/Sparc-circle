name: Android CI & APK Release

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Feature branches & PRs: unit tests + debug APK artifact only (no public release).
  debug-build:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run Unit Tests & Build Debug APK
        working-directory: android-app
        env:
          SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_SECRET: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon \
            -PSUPABASE_URL="$SUPABASE_URL_SECRET" \
            -PSUPABASE_ANON_KEY="$SUPABASE_ANON_SECRET"
          cp app/build/outputs/apk/debug/app-debug.apk ../SPARC-Study-Circle-debug-${{ github.run_number }}.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPARC-Study-Circle-debug-${{ github.run_number }}
          path: SPARC-Study-Circle-debug-${{ github.run_number }}.apk

  # main branch: signed Production APK + Google Play AAB, published as a GitHub Release.
  production-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Restore release keystore from GitHub Secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "ANDROID_KEYSTORE_BASE64 secret missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sparc-release.jks"

      - name: Unit Tests + Signed Release APK & AAB
        working-directory: android-app
        env:
          SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_SECRET: ${{ secrets.SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sparc-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease bundleRelease --no-daemon \
            -PSUPABASE_URL="$SUPABASE_URL_SECRET" \
            -PSUPABASE_ANON_KEY="$SUPABASE_ANON_SECRET"
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk ../SPARC-Study-Circle-v$VERSION.apk
          cp app/build/outputs/bundle/release/app-release.aab ../SPARC-Study-Circle-v$VERSION.aab

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify "SPARC-Study-Circle-v$VERSION.apk"
          "$APKSIGNER" verify --print-certs "SPARC-Study-Circle-v$VERSION.apk" 2>/dev/null | grep -i "certificate" || true

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SPARC-Study-Circle-v${{ env.VERSION }}-production
          path: |
            SPARC-Study-Circle-v${{ env.VERSION }}.apk
            SPARC-Study-Circle-v${{ env.VERSION }}.aab

      - name: Publish GitHub Release (signed APK + Play Store AAB)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then TAG="v$VERSION-build.${{ github.run_number }}"; fi
          gh release create "$TAG" \
            "SPARC-Study-Circle-v$VERSION.apk" \
            "SPARC-Study-Circle-v$VERSION.aab" \
            --target "${{ github.sha }}" \
            --latest \
            --title "SPARC Study Circle $TAG — Production Release" \
            --notes "প্রথম Production (release-signed) সংস্করণ ($TAG):
          - 📱 **SPARC-Study-Circle-v$VERSION.apk** — Release key দিয়ে সাইন করা, সরাসরি ফোনে ইনস্টলযোগ্য।
          - 🏪 **SPARC-Study-Circle-v$VERSION.aab** — Google Play Console-এ আপলোডের জন্য।
          - ⚠️ আগের debug APK (v3.8.x বা তার আগের) ফোনে থাকলে একবার আনইনস্টল করে এটি ইনস্টল করুন (সার্ভারের ডেটা অক্ষত থাকবে)।
          - অন্তর্ভুক্ত: দুই-স্তরের রোল সিস্টেম, Mentor প্যানেল, Circle Lead ভোট, পাঠ ও অনুশীলন, পাবলিশ, Exercise Template Importer, Cloud PDF/অডিও, লাইভ সার্ভার সিঙ্ক।"
