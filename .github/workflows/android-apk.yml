name: Android CI & APK Release

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run Domain Unit Tests & Build Debug APK (with Supabase GitHub Secrets)
        working-directory: android-app
        env:
          SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_SECRET: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon \
            -PSUPABASE_URL="$SUPABASE_URL_SECRET" \
            -PSUPABASE_ANON_KEY="$SUPABASE_ANON_SECRET"
          cp app/build/outputs/apk/debug/app-debug.apk ../SPARC-Study-Circle-v3.7.${{ github.run_number }}.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPARC-Study-Circle-v3.7.${{ github.run_number }}-apk
          path: SPARC-Study-Circle-v3.7.${{ github.run_number }}.apk

      - name: Publish Fresh Latest GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.7.${{ github.run_number }}"
          APK_FILE="SPARC-Study-Circle-v3.7.${{ github.run_number }}.apk"
          gh release create "$TAG" "$APK_FILE" \
            --latest \
            --title "SPARC Study Circle $TAG — Read & Practice, Circle Invites & Exercise Template Importer" \
            --notes "নতুন একাডেমিক ইউএক্স ও অনুশীলনী টেমপ্লেট আপডেট ($TAG):
          - 👥 **বই পড়ার সাথে স্টাডি সার্কেল ও ইনভাইট কানেকশন:** লাইব্রেরির প্রতিটি বইয়ের কার্ড এবং স্মার্ট রিডার—দুই জায়গাতেই **`👥 সার্কেল ও ইনভাইট`** বাটন থেকে ১ ক্লিকে বইটির সার্কেল সিলেক্ট/তৈরি, গবেষক ডিরেক্টরি থেকে ইনভাইট এবং WhatsApp/বাইরে লিংক শেয়ার করা যাবে।
          - ⚠️ **AI Feedback ওয়ার্নিং ও মানব মূল্যায়নে অগ্রাধিকার:** `AI ফিডব্যাক নিন` ক্লিক করলে এআই-এর সীমাবদ্ধতার সতর্কবার্তা দেখাবে এবং প্রাইমারি অপশন হিসেবে **`👤 মানুষের কাছে Evaluate-এর জন্য জমা দিন`** অফার করবে।
          - 🧭 **নতুন ভীতিমুক্ত নেভিগেশন নাম:** ৪র্থ ট্যাব **`পাঠ ও অনুশীলন / Read & Practice`** এবং ডানদিকের ৫ম ট্যাব **`পাবলিশ / Publish`** করা হয়েছে।
          - 📜 **Settings-এ ফিক্সড নিয়মাবলী পেজ:** `⚙️ Settings → 📜 নিয়ম / Rules`-এ স্টাডি সার্কেল, মানব মূল্যায়ন ও কপিরাইট নীতিমালা যুক্ত হয়েছে।
          - 📋 **অন্য লেখক/গবেষকের PDF + নির্ধারিত টেমপ্লেটে অনুশীলনী ইমপোর্ট:** মূল লেখকের ক্রেডিট ও উৎসসহ PDF আপলোড এবং ১-ক্লিক নমুনা টেমপ্লেট (`.txt` / `.csv` / `.json`) কপি/আপলোডের মাধ্যমে স্বয়ংক্রিয়ভাবে পুরো অধ্যায়ের অনুশীলনী যুক্ত করার সুবিধা।"
