name: Android CI & APK Release

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run Domain Unit Tests & Build Debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SPARC-Study-Circle-v2.0.0-debug.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPARC-Study-Circle-v2.0.0-debug-apk
          path: SPARC-Study-Circle-v2.0.0-debug.apk

      - name: Publish Preview GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v2.0.0-preview >/dev/null 2>&1; then
            gh release upload v2.0.0-preview SPARC-Study-Circle-v2.0.0-debug.apk --clobber
          else
            gh release create v2.0.0-preview SPARC-Study-Circle-v2.0.0-debug.apk \
              --prerelease \
              --title "SPARC Study Circle v2.0.0 (Debug APK Preview)" \
              --notes "অ্যান্ড্রয়েড ফোনে সরাসরি ডাউনলোড ও ইনস্টল করে টেস্ট করার জন্য SPARC Study Circle v2.0 ডিবাগ APK। কোনো Supabase বা Firebase কী ছাড়াই ইন্টারঅ্যাক্টিভ স্যান্ডবক্স মোডে সব ফিচার কাজ করবে।"
          fi
