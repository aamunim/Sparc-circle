name: Android CI & APK Release

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run Domain Unit Tests & Build Debug APK (with Supabase GitHub Secrets)
        working-directory: android-app
        env:
          SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_SECRET: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon \
            -PSUPABASE_URL="$SUPABASE_URL_SECRET" \
            -PSUPABASE_ANON_KEY="$SUPABASE_ANON_SECRET"
          cp app/build/outputs/apk/debug/app-debug.apk ../SPARC-Study-Circle-v3.2.${{ github.run_number }}.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPARC-Study-Circle-v3.2.${{ github.run_number }}-apk
          path: SPARC-Study-Circle-v3.2.${{ github.run_number }}.apk

      - name: Publish Fresh Latest GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.2.${{ github.run_number }}"
          APK_FILE="SPARC-Study-Circle-v3.2.${{ github.run_number }}.apk"
          gh release create "$TAG" "$APK_FILE" \
            --latest \
            --title "SPARC Study Circle $TAG — Live Supabase Connected + In-App API Key Manager" \
            --notes "নতুন লাইভ প্রোডাকশন বিল্ড ($TAG):
          - ☁️ **Live Supabase সংযুক্ত:** GitHub Repository Secrets থেকে স্বয়ংক্রিয়ভাবে ডাটাবেস মাইগ্রেশন, ৪টি Edge Function ডিপ্লয় এবং APK-তে লাইভ সংযোগ সম্পন্ন।
          - 🔑 **In-App API Keys ম্যানেজার (`⚙️ Settings → API Keys ম্যানেজার`):** অ্যাপের ভেতর থেকেই **Gemini API Key**, **bKash Key**, **SSLCommerz Key**, **Custom Jitsi URL** এবং **Custom Supabase Override** যেকোনো সময় Add / Update / Remove করা যাবে!
          - 📄 নেটিভ PDF বুক রিডার, 🎧 Media3 ExoPlayer অডিও, কাস্টম SPARC আইকন ও ৩-থিম সুইচার যুক্ত।"
