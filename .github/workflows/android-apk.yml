name: Android CI & APK Release

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run Domain Unit Tests & Build Debug APK (with Supabase GitHub Secrets)
        working-directory: android-app
        env:
          SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_SECRET: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon \
            -PSUPABASE_URL="$SUPABASE_URL_SECRET" \
            -PSUPABASE_ANON_KEY="$SUPABASE_ANON_SECRET"
          cp app/build/outputs/apk/debug/app-debug.apk ../SPARC-Study-Circle-v3.5.${{ github.run_number }}.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPARC-Study-Circle-v3.5.${{ github.run_number }}-apk
          path: SPARC-Study-Circle-v3.5.${{ github.run_number }}.apk

      - name: Publish Fresh Latest GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.5.${{ github.run_number }}"
          APK_FILE="SPARC-Study-Circle-v3.5.${{ github.run_number }}.apk"
          gh release create "$TAG" "$APK_FILE" \
            --latest \
            --title "SPARC Study Circle $TAG — Supabase Storage Cloud PDF & MP3 Audio Upload/Stream" \
            --notes "নতুন ক্লাউড স্টোরেজ মিডিয়া আপডেট ($TAG):
          - ☁️ **Supabase Storage (`sparc-books` ও `sparc-audio`) আপলোড স্টুডিও:** অ্যাপের **`লাইব্রেরি → ☁️ ক্লাউড বুক ও অডিও স্টুডিও`** (এবং `admin-web` পোর্টাল) থেকে সরাসরি ফোনের যেকোনো **বইয়ের PDF** এবং **বাংলা অডিও সামারি (MP3/M4A/WAV)** Supabase Storage বাকেটে আপলোড করা যাবে!
          - 📄 **অটো-ডাউনলোড ও অফলাইন ক্যাশড PDF রিডার:** ক্লাউডে PDF আপলোড করলেই সব ইউজারের নেটিভ `PdfRenderer` ভিউয়ারে স্বয়ংক্রিয়ভাবে ডাউনলোড ও ক্যাশ হয়ে ওপেন হবে।
          - 🎧 **লাইভ MP3 অডিও সামারি স্ট্রিমিং:** `sparc-audio` বাকেটের বাংলা অডিও সামারি সরাসরি Media3 `ExoPlayer`-এ স্ট্রিম হবে (`1x`–`2x` স্পিড কন্ট্রোলসহ)।"
