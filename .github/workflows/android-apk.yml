name: Android CI & APK Release

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run Domain Unit Tests & Build Debug APK (with Supabase GitHub Secrets)
        working-directory: android-app
        env:
          SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_SECRET: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon \
            -PSUPABASE_URL="$SUPABASE_URL_SECRET" \
            -PSUPABASE_ANON_KEY="$SUPABASE_ANON_SECRET"
          cp app/build/outputs/apk/debug/app-debug.apk ../SPARC-Study-Circle-v3.3.${{ github.run_number }}.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPARC-Study-Circle-v3.3.${{ github.run_number }}-apk
          path: SPARC-Study-Circle-v3.3.${{ github.run_number }}.apk

      - name: Publish Fresh Latest GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.3.${{ github.run_number }}"
          APK_FILE="SPARC-Study-Circle-v3.3.${{ github.run_number }}.apk"
          gh release create "$TAG" "$APK_FILE" \
            --latest \
            --title "SPARC Study Circle $TAG — Instant Sign-Up (429 Fix) + 100% English/Bangla Localization" \
            --notes "নতুন আপডেটেড রিলিজ ($TAG):
          - ✅ **Sign-Up HTTP 429 Error সমাধান:** নতুন `auth-register` Edge Function ও Supabase Auto-Confirm যুক্ত হওয়ায় ইমেইল রেট-লিমিট (`HTTP 429`) ছাড়াই তাৎক্ষণিক অ্যাকাউন্ট তৈরি ও লগইন হবে।
          - 🌐 **১০০% পূর্ণাঙ্গ English ⇄ বাংলা ভাষা সুইচ:** লগইন স্ক্রিনের উপরের **EN / বাংলা** বাটন কিংবা `⚙️ Settings` থেকে ভাষা পরিবর্তন করলে পুরো অ্যাপের সব ট্যাব, কার্ড, বাটন, কুইজ ও কনটেন্ট সাথে সাথে ইংরেজি/বাংলায় রূপান্তরিত হবে।
          - 🔑 **In-App API Keys ম্যানেজার (`⚙️ Settings → API Keys`):** অ্যাপের ভেতর থেকেই Gemini API Key, bKash/SSLCommerz Key ও Custom Jitsi/Supabase URL যেকোনো সময় Add / Remove করা যাবে।"
