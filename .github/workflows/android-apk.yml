name: Android CI & APK Release

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Feature branches & PRs: unit tests + debug APK artifact only (no public release).
  debug-build:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Ensure Android API 36 SDK platform
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          fi

      - name: Run Unit Tests & Build Debug APK
        working-directory: android-app
        env:
          SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_SECRET: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon \
            -PSUPABASE_URL="$SUPABASE_URL_SECRET" \
            -PSUPABASE_ANON_KEY="$SUPABASE_ANON_SECRET"
          cp app/build/outputs/apk/debug/app-debug.apk ../SPARC-Study-Circle-debug-${{ github.run_number }}.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPARC-Study-Circle-debug-${{ github.run_number }}
          path: SPARC-Study-Circle-debug-${{ github.run_number }}.apk

  # main branch: signed Production APK + Google Play AAB (API 36 + R8 mapping + NDK symbols).
  production-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Ensure Android API 36 SDK platform
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          fi

      - name: Restore release keystore from GitHub Secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "ANDROID_KEYSTORE_BASE64 secret missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sparc-release.jks"

      - name: Unit Tests + Signed Release APK & AAB (API 36 + R8 + Symbols)
        working-directory: android-app
        env:
          SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_SECRET: ${{ secrets.SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sparc-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_NDK_PATH: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease bundleRelease --no-daemon \
            -PSUPABASE_URL="$SUPABASE_URL_SECRET" \
            -PSUPABASE_ANON_KEY="$SUPABASE_ANON_SECRET"
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk ../SPARC-Study-Circle-v$VERSION.apk
          cp app/build/outputs/bundle/release/app-release.aab ../SPARC-Study-Circle-v$VERSION.aab
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt ../SPARC-Study-Circle-v$VERSION-mapping.txt
          fi
          # Build companion Play Console native-symbols.zip using NDK llvm-objcopy
          OBJCOPY=$(find "${ANDROID_NDK_LATEST_HOME:-$ANDROID_HOME/ndk}" -name llvm-objcopy 2>/dev/null | head -1)
          if [ -n "$OBJCOPY" ]; then
            mkdir -p "$RUNNER_TEMP/aab_libs" "$RUNNER_TEMP/sym_zip"
            unzip -qo ../SPARC-Study-Circle-v$VERSION.aab "base/lib/*/*.so" -d "$RUNNER_TEMP/aab_libs" || true
            for so in "$RUNNER_TEMP"/aab_libs/base/lib/*/*.so; do
              [ -f "$so" ] || continue
              abi=$(basename "$(dirname "$so")")
              name=$(basename "$so")
              mkdir -p "$RUNNER_TEMP/sym_zip/$abi"
              "$OBJCOPY" --only-keep-debug "$so" "$RUNNER_TEMP/sym_zip/$abi/$name.dbg" || cp "$so" "$RUNNER_TEMP/sym_zip/$abi/$name.sym"
            done
            (cd "$RUNNER_TEMP/sym_zip" && zip -qr "$GITHUB_WORKSPACE/SPARC-Study-Circle-v$VERSION-native-symbols.zip" .)
          fi

      - name: Verify APK signature & AAB metadata
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify "SPARC-Study-Circle-v$VERSION.apk"
          unzip -l "SPARC-Study-Circle-v$VERSION.aab" | grep "BUNDLE-METADATA"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SPARC-Study-Circle-v${{ env.VERSION }}-production
          path: |
            SPARC-Study-Circle-v${{ env.VERSION }}.apk
            SPARC-Study-Circle-v${{ env.VERSION }}.aab
            SPARC-Study-Circle-v${{ env.VERSION }}-native-symbols.zip

      - name: Publish GitHub Release (signed APK + Play Store AAB + Native Symbols)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then TAG="v$VERSION-build.${{ github.run_number }}"; fi
          EXTRA_ASSETS=()
          [ -f "SPARC-Study-Circle-v$VERSION-native-symbols.zip" ] && EXTRA_ASSETS+=("SPARC-Study-Circle-v$VERSION-native-symbols.zip")
          gh release create "$TAG" \
            "SPARC-Study-Circle-v$VERSION.apk" \
            "SPARC-Study-Circle-v$VERSION.aab" \
            "${EXTRA_ASSETS[@]}" \
            --target "${{ github.sha }}" \
            --latest \
            --title "SPARC Study Circle $TAG — Play Store API 36 Production Release" \
            --notes "Google Play Console কমপ্লায়েন্ট Production সংস্করণ ($TAG, versionCode 391):
          - ✅ **Target SDK 36 (Android 16):** Play Console-এর API level 36 আবশ্যকীয় শর্ত পূরণ করা হয়েছে।
          - ✅ **R8 Obfuscation & Mapping Embedded:** AAB ফাইলের ভেতরেই স্বয়ংক্রিয়ভাবে deobfuscation ফাইল (\`proguard.map\`) যুক্ত আছে এবং অ্যাপের আকার প্রায় ৭০% কমেছে।
          - ✅ **Native Debug Symbols:** NDK \`debugSymbolLevel = FULL\` সক্রিয় করা হয়েছে এবং আলাদা \`native-symbols.zip\` রিলিজে সংযুক্ত করা হয়েছে (Play Console-এ ঐচ্ছিকভাবে আপলোডযোগ্য)।
          - 📱 **SPARC-Study-Circle-v$VERSION.apk** — সরাসরি ফোনে ইনস্টলের জন্য।
          - 🏪 **SPARC-Study-Circle-v$VERSION.aab** — সরাসরি Google Play Console-এ আপলোডের জন্য।"
