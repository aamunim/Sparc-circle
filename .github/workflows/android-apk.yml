name: Android CI & APK Release

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run Domain Unit Tests & Build Debug APK (with Supabase GitHub Secrets)
        working-directory: android-app
        env:
          SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_SECRET: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon \
            -PSUPABASE_URL="$SUPABASE_URL_SECRET" \
            -PSUPABASE_ANON_KEY="$SUPABASE_ANON_SECRET"
          cp app/build/outputs/apk/debug/app-debug.apk ../SPARC-Study-Circle-v3.4.${{ github.run_number }}.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPARC-Study-Circle-v3.4.${{ github.run_number }}-apk
          path: SPARC-Study-Circle-v3.4.${{ github.run_number }}.apk

      - name: Publish Fresh Latest GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.4.${{ github.run_number }}"
          APK_FILE="SPARC-Study-Circle-v3.4.${{ github.run_number }}.apk"
          gh release create "$TAG" "$APK_FILE" \
            --latest \
            --title "SPARC Study Circle $TAG — 100% Live Multi-User Two-Way Supabase Sync" \
            --notes "নতুন মাল্টি-ইউজার লাইভ সিঙ্ক রিলিজ ($TAG):
          - 🔄 **১০০% Live Two-Way Supabase Sync (Multi-User):** সার্কেল তৈরি/জয়েন, সুপারভাইজার ভোট, পিয়ার Poke ও ১-ট্যাপ রিপ্লাই, কুইক পোল ও ডিবেট কমেন্ট, ডিরেক্টরি ইনভাইট, কুইজ সাবমিশন (RLS-লকড Answer Key আনলক), রাইটিং টাস্ক, ওয়ালেট TrxID টপ-আপ এবং হার্ডকপি বুক অর্ডার—সবকিছু এখন লাইভ Supabase PostgreSQL ডাটাবেসের সাথে রিয়েল-টাইমে টু-ওয়ে সিঙ্ক হয়!
          - 🔐 **স্থায়ী JWT সেশন ও Auto-Refresh:** অ্যাপ বন্ধ করে পুনরায় চালু করলেও লগইন সেশন অক্ষুণ্ণ থাকে এবং প্রতি ১২ সেকেন্ডে অটো-সিঙ্ক + উপরের `↻` বাটনে ১-ট্যাপ লাইভ রিফ্রেশ সুবিধা যুক্ত।
          - 🌐 **১০০% পূর্ণাঙ্গ English ⇄ বাংলা ভাষা সুইচ** এবং **Instant Sign-Up (`HTTP 429` ফিক্সড)**।"
