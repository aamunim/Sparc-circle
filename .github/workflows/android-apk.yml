name: Android CI & APK Release

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run Domain Unit Tests & Build Debug APK (with Supabase GitHub Secrets)
        working-directory: android-app
        env:
          SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_SECRET: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon \
            -PSUPABASE_URL="$SUPABASE_URL_SECRET" \
            -PSUPABASE_ANON_KEY="$SUPABASE_ANON_SECRET"
          cp app/build/outputs/apk/debug/app-debug.apk ../SPARC-Study-Circle-v3.8.${{ github.run_number }}.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPARC-Study-Circle-v3.8.${{ github.run_number }}-apk
          path: SPARC-Study-Circle-v3.8.${{ github.run_number }}.apk

      - name: Publish Fresh Latest GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.8.${{ github.run_number }}"
          APK_FILE="SPARC-Study-Circle-v3.8.${{ github.run_number }}.apk"
          gh release create "$TAG" "$APK_FILE" \
            --latest \
            --title "SPARC Study Circle $TAG — Two-Tier Roles, Mentor Panel & Server Sync" \
            --notes "নতুন দুই-স্তরের রোল সিস্টেম ও সার্ভার সিঙ্ক আপডেট ($TAG):
          - 🛡️ **৪টি মূল সিস্টেম রোল (Core System Roles):** `Admin (SPARC টিম)`, `Mentor (মেন্টর)`, `Circle Lead (সার্কেল লিড)` এবং `Researcher (গবেষক)` — টপ হেডার, প্রোফাইল ও ডিরেক্টরিতে রোল ব্যাজসহ।
          - ⭐ **সার্কেল লিড বনাম মেন্টর পৃথকীকরণ:** সদস্যদের ভোটে এখন নির্বাচিত হবেন **`Circle Lead`** (সেশন ও প্রেজেন্টার সমন্বয়ক), আর SPARC নিযুক্ত **`Mentor`** দেখবেন `F–J` নম্বর (`0–3`), রেড-ফ্ল্যাগ, **`🤝 Peer Buddy`** যুক্তকরণ ও ডেডলাইন/আনলক কন্ট্রোল।
          - 🏅 **৪টি ডায়নামিক অ্যাক্টিভিটি ব্যাজ:** `🚀 গ্রুপ উদ্যোক্তা (+50 পয়েন্ট)`, `🎤 উপস্থাপক (Chapter Presenter)`, `✍️ সহ-লেখক (Co-Author)` এবং `🤝 সহপাঠী সঙ্গী (Peer Buddy)`।
          - 🎭 **Admin প্যানেল ও Settings Role Switcher:** অ্যাডমিন প্যানেল থেকে রোল/মেন্টর/অর্ডার পরিচালনা এবং টেস্টিংয়ের সুবিধার্থে `⚙️ Settings → 📱 অ্যাপ`-এ দ্রুত Role Switcher।
          - 🔄 **সম্পূর্ণ 'সার্ভার / Server' লেবেলিং:** অ্যাপের কোথাও আর `Supabase` শব্দটি নেই — সব জায়গায় পরিষ্কারভাবে `সার্ভার / Server` ব্যবহৃত হয়েছে।"
